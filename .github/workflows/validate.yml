name: foundation-validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile diagnostic sources
        run: python -m compileall -q scripts tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run foundation diagnostic
        run: python scripts/diagnose.py --root . --json
      - name: Run RDL validator on fixtures (expects exit 1, broken fixture included)
        run: python -c "import subprocess,sys; r=subprocess.run([sys.executable,'scripts/rdl_validate.py','--root','tests/fixtures/rdl','--json'],capture_output=True,text=True); print(r.stdout[-1500:]); sys.exit(0 if r.returncode==1 else 1)"
